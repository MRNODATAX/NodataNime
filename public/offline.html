<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#03050c" />
    <title>Mode Offline — NodataNime</title>
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: radial-gradient(circle at 50% 18%, rgba(229, 9, 20, 0.16), transparent 52%), #03050c;
        color: #f3f5fa;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .offline-card {
        max-width: 440px;
        width: 100%;
        padding: 36px 28px;
        border-radius: 24px;
        background: rgba(14, 19, 34, 0.85);
        border: 1px solid rgba(255, 255, 255, 0.1);
        text-align: center;
        box-shadow: 0 24px 64px rgba(0, 0, 0, 0.55);
      }
      .offline-logo {
        width: 68px;
        height: 68px;
        margin: 0 auto 18px;
        display: block;
      }
      h1 {
        font-size: 1.45rem;
        margin-bottom: 10px;
        letter-spacing: -0.02em;
      }
      h1 span {
        color: #ff2a4b;
      }
      p {
        color: #9da6be;
        font-size: 0.94rem;
        line-height: 1.6;
        margin-bottom: 24px;
      }
      button,
      .offline-reload-btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 12px 22px;
        border-radius: 999px;
        border: none;
        background: linear-gradient(135deg, #e50914, #ff2a4b);
        color: #fff;
        font-weight: 700;
        font-size: 0.92rem;
        cursor: pointer;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main class="offline-card">
      <img src="/assets/favicon.svg" alt="NodataNime" class="offline-logo" />
      <h1>Nodata<span>Nime</span> Sedang Offline</h1>
      <p>
        Koneksi internet perangkat Anda sedang terputus. Periksa jaringan Wi-Fi atau data seluler, lalu muat ulang halaman untuk melanjutkan menonton.
      </p>
      <a href="/" class="offline-reload-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12a9 9 0 1 1-2.64-6.36" />
          <polyline points="21 3 21 9 15 9" />
        </svg>
        Coba Muat Ulang
      </a>
    </main>
  </body>
</html>
